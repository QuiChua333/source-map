<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lịch Trình Chi Tiết · Vina Takeuchi 2026 | Viet Sun Travel</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- FontAwesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Tailwind config -->
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: { sans: ["Be Vietnam Pro", "sans-serif"] },
            colors: {
              brand: {
                50: "#eff6ff",
                100: "#dbeafe",
                200: "#bfdbfe",
                300: "#93c5fd",
                400: "#60a5fa",
                500: "#3b82f6",
                600: "#2563eb",
                700: "#1d4ed8",
                800: "#1e40af",
                900: "#1e3a8a",
                950: "#172554",
              },
            },
          },
        },
      };
    </script>

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="VST Tour" />
    <link rel="apple-touch-icon" href="/images/icon-192.png" />
    <meta name="theme-color" content="#2563eb" />

    <link rel="stylesheet" href="css/schedule.css" />
  </head>

  <body
    class="bg-slate-100 antialiased text-slate-800"
    style="font-family: &quot;Be Vietnam Pro&quot;, sans-serif"
  >
    <!-- ====================== HEADER ====================== -->
    <header
      class="bg-white border-b border-slate-200 shadow-sm sticky top-0 z-20"
    >
      <div
        class="max-w-3xl mx-auto px-4 sm:px-6 py-3 flex items-center justify-between gap-4"
      >
        <!-- Logo + tiêu đề -->
        <div class="flex items-center gap-3 min-w-0">
          <a
            href="index.html"
            title="Về bản đồ lộ trình"
            class="w-9 h-9 rounded-xl bg-brand-50 flex items-center justify-center text-brand-600 hover:bg-brand-100 transition shrink-0"
          >
            <i class="fa-solid fa-map-location-dot"></i>
          </a>
          <div class="min-w-0">
            <p
              class="text-[10px] font-semibold uppercase tracking-widest text-slate-400"
            >
              Viet Sun Travel
            </p>
            <h1
              class="text-base sm:text-lg font-extrabold text-slate-800 leading-tight truncate"
            >
              Lịch Trình Chi Tiết
            </h1>
          </div>
        </div>

        <div class="flex items-center gap-2">
          <!-- Nút thêm ngày (chỉ hiện admin mode) -->
          <button
            id="add-day-btn"
            title="Thêm ngày mới"
            class="hidden h-9 px-3 rounded-xl border-2 border-emerald-300 bg-emerald-50 items-center justify-center gap-1.5 text-emerald-600 hover:bg-emerald-100 transition text-xs font-semibold"
          >
            <i class="fa-solid fa-plus text-[10px]"></i> Thêm ngày
          </button>
          <!-- Nút admin -->
          <button
            id="admin-btn"
            title="Chế độ quản trị"
            class="w-9 h-9 rounded-xl border-2 border-slate-200 bg-white flex items-center justify-center text-slate-400 hover:border-amber-300 hover:text-amber-600 transition"
          >
            <i class="fa-solid fa-gear"></i>
          </button>
          <!-- Nút notification -->
          <button
            id="notif-btn"
            title="Bật/tắt nhắc nhở"
            class="w-9 h-9 rounded-xl border-2 border-slate-200 bg-white flex items-center justify-center text-slate-500 hover:border-brand-300 hover:text-brand-600 transition"
          >
            <i id="notif-icon" class="fa-regular fa-bell"></i>
          </button>
        </div>
      </div>
    </header>

    <!-- ====================== NOTIFICATION OPT-IN ====================== -->
    <div class="max-w-3xl mx-auto px-4 sm:px-6 mt-4">
      <div id="notif-card" class="notif-card">
        <div
          class="w-10 h-10 rounded-xl bg-brand-100 flex items-center justify-center text-brand-600 shrink-0"
        >
          <i class="fa-solid fa-bell text-lg"></i>
        </div>
        <div class="flex-1 min-w-0">
          <p class="font-bold text-slate-800 text-sm">
            Bật nhắc nhở hành trình
          </p>
          <p class="text-slate-500 text-xs mt-0.5">
            Nhận thông báo 20 phút trước mỗi sự kiện
          </p>
        </div>
        <button
          id="notif-enable-btn"
          class="px-4 py-2 rounded-xl bg-brand-600 hover:bg-brand-700 text-white text-xs font-semibold transition shrink-0"
        >
          Bật ngay
        </button>
      </div>
    </div>

    <!-- ====================== MAIN CONTENT ====================== -->
    <main
      id="schedule-content"
      class="max-w-3xl mx-auto px-4 sm:px-6 py-6 pb-24 space-y-6"
    ></main>

    <!-- ====================== FLOATING MAP BUTTON ====================== -->
    <a
      href="index.html"
      title="Xem bản đồ lộ trình"
      class="fixed bottom-5 right-5 z-30 w-11 h-11 rounded-xl bg-white shadow-lg border border-slate-200 flex items-center justify-center text-brand-700 hover:bg-brand-50 hover:shadow-xl transition"
    >
      <i class="fa-solid fa-map-location-dot"></i>
    </a>

    <!-- ====================== SCRIPTS ====================== -->
    <!-- Firebase SDK (compat) -->
    <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-messaging-compat.js"></script>

    <script src="js/schedule-data.js"></script>
    <script src="js/notifications.js"></script>
    <script src="js/schedule.js"></script>
  </body>
</html>
